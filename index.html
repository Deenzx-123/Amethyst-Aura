<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amethyst Aura | The Art of Stillness</title>

    <!-- Tailwind CDN (OK for now) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap"
      rel="stylesheet"
    >

    <style>
      body {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        background-color: #FAF9F6;
      }
    </style>

    <link rel="stylesheet" href="/index.css">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          aura: {
            bone: '#FAF9F6',
            beige: '#EBE8E0',
            charcoal: '#1A1A1A',
            slate: '#4A4A4A',
            gold: '#C5A059',
            champagne: '#E3D5C5',
            linen: '#FFFFFF'
          }
        },
        fontFamily: {
          serif: ['"Playfair Display"', 'serif'],
          sans: ['"Plus Jakarta Sans"', 'sans-serif'],
        },
        boxShadow: {
          'aura-subtle': '0 4px 30px rgba(0, 0, 0, 0.02)',
          'aura-elevated': '0 20px 50px -15px rgba(0, 0, 0, 0.1)',
        },
        animation: {
          'fade-up': 'fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          'fade-in': 'fadeIn 1s ease-out forwards',
          'slow-zoom': 'slowZoom 25s infinite alternate',
        },
        keyframes: {
          fadeUp: {
            '0%': { opacity: '0', transform: 'translateY(30px)' },
            '100%': { opacity: '1', transform: 'translateY(0)' },
          },
          fadeIn: {
            '0%': { opacity: '0' },
            '100%': { opacity: '1' },
          },
          slowZoom: {
            '0%': { transform: 'scale(1)' },
            '100%': { transform: 'scale(1.15)' },
          }
        }
      }
    }
  }
</script>

  </head>

  <body class="bg-aura-bone text-aura-charcoal font-sans">
    <div id="root"></div>

    <!-- Vite entry -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
